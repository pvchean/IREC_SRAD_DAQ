; MTP spike: standalone ESP-IDF project. No PFS, no NAND pins. Same platform as the main project.
[platformio]
default_envs = spike
src_dir = src

[env:spike]
platform = platformio/espressif32 @ 7.1.3
board = esp32-s3-devkitc-1
framework = espidf
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = partitions_pfs.csv
board_build.extra_flags =
monitor_speed = 115200
; build_flags = -DSPIKE_FORCE_FILES=1   (ignore GPIO 2: always enter files mode after the 10 s grace)

[env:spike_force]
extends = env:spike
build_flags = -DSPIKE_FORCE_FILES=1

; Build only, flash only after MTP-P-11 steps a and b passed: crash-reset disconnect (UNVERIFIED), see Docs/MTP/Spike_Report.md MTP-P-11.
[env:spike_force_p3]
extends = env:spike_force
build_flags = -DSPIKE_FORCE_FILES=1 -DSPIKE_P3=1
