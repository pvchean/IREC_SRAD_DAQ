; IREC SRAD DAQ: ESP-IDF only (no Arduino). The versions are the versions of
; Paranoid-FS v0.3.1 (platform 7.1.3 = ESP-IDF 6.1.0, GCC 15.2.0).
[platformio]
default_envs = daq
src_dir = src

[env:daq]
platform = platformio/espressif32 @ 7.1.3
board = esp32-s3-devkitc-1
framework = espidf
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = partitions_pfs.csv
; The board file adds ARDUINO_* macros. This empty value removes them.
board_build.extra_flags =
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Test build: synthetic samples in place of both sensors (ADS1115 and NAU7802), and a read-back check after 10 s.
[env:daq_sim]
extends = env:daq
build_flags = -DDAQ_SIM=1

; Test build: UART1 is looped back in the chip, and the board sends as device (ID xor 1). It receives its own
; packets as the packets of another board: tests the parser, the repeat, and the remote SD file.
[env:daq_chain_test]
extends = env:daq
build_flags = -DDAQ_CHAIN_SELFTEST=1

; Read-only test of the NAND SPI clock: starts the NAND driver, no mount, reads all pages 3 times, prints digests. No writes.
; daq_nandread uses the clock of board.h (NAND_SPI_HZ), daq_nandread40 uses 40 MHz.
[env:daq_nandread]
extends = env:daq
build_flags = -DDAQ_NANDREAD=1
[env:daq_nandread40]
extends = env:daq
build_flags = -DDAQ_NANDREAD=1 -DNAND_SPI_HZ=40000000U

; Boot-time profile: time marks of the start-up, and the commands PROFILE and REBOOT [WRAP] (counters of the busy waits).
; daq_profile uses the clock of board.h, daq_profile40 uses 40 MHz. REBOOT is a software reset: the USB link of the host can drop.
[env:daq_profile]
extends = env:daq
build_flags = -DDAQ_PROFILE=1
[env:daq_profile40]
extends = env:daq
build_flags = -DDAQ_PROFILE=1 -DNAND_SPI_HZ=40000000U

; Test build: a board with no load cell. The driver talks to address 0x2B, which does not answer, as an absent NAU7802 does not.
[env:daq_nolc]
extends = env:daq
build_flags = -DNAU_ADDR=0x2B

; Test build: the board with device ID DAQ_TOGGLE_ID (now 5) drives GPIO 16 (0 V / 3.3 V square wave, 250 ms per state)
; into the sensor line, so the readings of both boards show a signal that can be found in the files.
; Flash this to both boards; only the board with that ID drives the pin. Change the ID or the period here.
; GPIO 16 is now the DRDY line of the NAU7802 (push-pull output of the breakout). Remove the DRDY wire before this build
; is used, or the two outputs fight. This build does not start the NAU7802.
[env:daq_toggle]
extends = env:daq
build_flags = -DDAQ_TOGGLE=1 -DDAQ_TOGGLE_ID=5 -DDAQ_TOGGLE_MS=250

; Files-mode build (USB MTP, read only). With MODE2 low the board boots as a read-only drive (no sensors, no chain, no recording,
; no WiFi). With MODE2 high it is the serial DAQ. In this build recording is DISABLED for good: MODE1 high does not record, and
; REC ON is refused. Use this build for all tests on a board with data in the NAND. See Docs/MTP/Boot_Integration.md.
; The USB stack (esp_tinyusb fork, TinyUSB MTP + CDC) comes only with this env: board_build.cmake_extra_args sets DAQ_MTP_USB, which the
; top CMakeLists.txt reads (adds mtp_usb/, sdkconfig defaults mtp_usb/daq_mtp.defaults, lock file dependencies.lock.daq_mtp).
[env:daq_mtp]
extends = env:daq
build_flags = -DDAQ_MTP=1 -DDAQ_MTP_USB=1
board_build.cmake_extra_args = -DDAQ_MTP_USB=ON

; Test build for a board with no MODE2 switch: files mode always (after the 10 s grace). Same as daq_mtp otherwise. The command LEAVE
; gives serial mode for one boot. Use it for the hardware tests of Docs/MTP/Merge_Report.md MTP-M-7.
[env:daq_mtp_force]
extends = env:daq_mtp
build_flags = -DDAQ_MTP=1 -DDAQ_MTP_USB=1 -DDAQ_MTP_FORCE_FILES=1
